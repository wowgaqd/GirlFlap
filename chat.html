<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню сайта</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #121212, #ffffff);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Отключение прокрутки страницы */
        }

        .menu {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px; /* Уменьшено закругление */
            padding: 10px; /* Уменьшены отступы */
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5); /* Уменьшена тень */
            width: 90%;
            max-width: 320px; /* Меньше максимальный размер для мобильной версии */
            height: 70%;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 8px; /* Уменьшены отступы */
            border-radius: 8px; /* Закругление */
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 8px; /* Уменьшены отступы */

            /* Кастомизация прокрутки */
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #555 #444; /* Цвет для Firefox */
        }

        .content::-webkit-scrollbar {
            width: 8px; /* Уменьшана ширина */
        }

        .content::-webkit-scrollbar-track {
            background: #444; /* Цвет заднего фона полоски прокрутки */
            border-radius: 8px; /* Закругление */
        }

        .content::-webkit-scrollbar-thumb {
            background-color: #555; /* Цвет ползунка */
            border-radius: 8px; /* Закругление */
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: #777; /* Цвет ползунка при наведении */
        }

        .input-area {
            display: flex;
            align-items: center;
            border: 1px solid rgba(128, 128, 128, 0.5);
            padding: 8px; /* Уменьшены отступы */
            border-radius: 10px;
            background-color: rgba(50, 50, 50, 0.8);
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px; /* Уменьшены отступы */
            border: none;
            border-radius: 8px; /* Закругление */
            margin-right: 8px; /* Уменьшены отступы */
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 8px 12px; /* Уменьшены отступы */
            border: none;
            border-radius: 8px; /* Закругление */
            background: linear-gradient(45deg, #800080, #dda0dd);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #a05cb3, #ff00ff);
        }

        @media (max-width: 600px) {
            .menu {
                width: 95%;
                max-width: 90%; /* Меньше максимальный размер для мобильной версии */
            }
        }

        .message {
            background: linear-gradient(135deg, #4e4e4e 30%, #3a3a3a 100%);
            border-radius: 8px; /* Закругление */
            padding: 6px 10px; /* Уменьшены отступы */
            margin-bottom: 10px; /* Уменьшены отступы */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); /* Уменьшена тень */
            word-wrap: break-word;
            position: relative;
            font-family: 'Arial', sans-serif;
            max-width: calc(100% - 20px); /* Уменьшение ширины сообщения */
        }

        .message b {
            color: #e0e0e0;
            font-size: 11px; /* Уменьшение размера шрифта имени */
            font-weight: bold;
        }

        .message p {
            margin: 2px 0; /* Уменьшены отступы между строками */
            font-size: 13px; /* Уменьшение размера шрифта сообщения */
            color: #ccc;
        }

        .timestamp {
            font-size: 9px; /* Уменьшение размера шрифта временной метки */
            color: #bbb;
            margin-top: 4px;
        }

        .message .reply-button {
            font-size: 9px; /* Уменьшение размера шрифта кнопки ответа */
            color: #007bff;
            text-decoration: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
        }

        .guest-tag {
            background-color: rgba(128, 128, 128, 0.5);
            color: #ffffff;
            border-radius: 7.5px;
            padding: 2px 5px;
            font-size: 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="menu">
    <div class="content" id="message-container">
        <!-- Сообщения будут отображаться здесь -->
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-button">Отправить</button>
    </div>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const messageContainer = document.getElementById('message-container');

    // Состояние для уникальных ID
    let userID = localStorage.getItem('userID');
    if (userID === null) {
        userID = Math.floor(Math.random() * 1001); // Генерация уникального ID от 0 до 1000
        localStorage.setItem('userID', userID);
    }

    sendButton.addEventListener('click', sendMessage);

    function sendMessage() {
        const messageText = messageInput.value.trim();
        const username = `GirlFlap[${userID}]`; // Имя пользователя с ID
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = currentDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        if (messageText) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.innerHTML = `
                <b>${username}<span class="guest-tag">Гость</span></b>
                <p>${messageText}</p>
                <span class="timestamp">${formattedDate}, ${formattedTime}</span>
                <a href="#reply" class="reply-button" onclick="document.getElementById('message-input').value = '@${username} ';">Ответить</a>
            `;
            messageContainer.appendChild(message);
            messageInput.value = '';
            messageContainer.scrollTop = messageContainer.scrollHeight; // Прокрутка вниз
        }
    }
</script>

</body>
</html>

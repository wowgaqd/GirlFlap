<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню сайта</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #121212, #ffffff);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Отключение прокрутки страницы */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .menu {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 90%; /* Изменено для адаптации */
            max-width: 400px;
            height: 70%;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex-grow: 1;
            overflow-y: auto; 
            padding: 10px;
            border-radius: 10px;
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 10px;

            /* Кастомизация прокрутки */
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #555 #444; /* Цвет для Firefox */
        }

        /* Кастомизация для Webkit (Chrome, Safari) */
        .content::-webkit-scrollbar {
            width: 10px; /* Увеличена ширина */
        }

        .content::-webkit-scrollbar-track {
            background: #444; /* Цвет заднего фона полоски прокрутки */
            border-radius: 10px; /* Закругление */
        }

        .content::-webkit-scrollbar-thumb {
            background-color: #555; /* Цвет ползунка */
            border-radius: 10px; /* Закругление */
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: #777; /* Цвет ползунка при наведении */
        }

        .input-area {
            display: flex;
            align-items: center;
            border: 1px solid rgba(128, 128, 128, 0.5);
            padding: 10px;
            border-radius: 15px;
            background-color: rgba(50, 50, 50, 0.8);
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            margin-right: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #800080, #dda0dd);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #a05cb3, #ff00ff);
        }

        @media (max-width: 600px) {
            .menu {
                width: 90%;
            }
        }

        .message {
            background: linear-gradient(135deg, #4e4e4e 30%, #3a3a3a 100%);
            border-radius: 10px;
            padding: 8px 12px; /* Уменьшение отступов */
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
            word-wrap: break-word;
            position: relative;
            font-family: 'Arial', sans-serif;
            max-width: calc(100% - 20px); /* Уменьшение ширины сообщения */
        }

        .message b {
            color: #e0e0e0;
            font-size: 12px; /* Уменьшение размера шрифта имени */
            font-weight: bold;
        }

        .message p {
            margin: 3px 0; /* Уменьшение отступов между строками */
            font-size: 14px; /* Уменьшение размера шрифта сообщения */
            color: #ccc;
        }

        .timestamp {
            font-size: 10px; /* Уменьшение размера шрифта временной метки */
            color: #bbb;
            margin-top: 5px;
        }

        .message .reply-button {
            font-size: 10px; /* Уменьшение размера шрифта кнопки ответа */
            color: #007bff;
            text-decoration: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>

<div class="menu">
    <div class="content" id="message-container">
        <!-- Сообщения будут отображаться здесь -->
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-button">Отправить</button>
    </div>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const messageContainer = document.getElementById('message-container');

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    function sendMessage() {
        const messageText = messageInput.value.trim();
        const username = "Пользователь"; // Здесь можно заменить на фактическое имя пользователя
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = currentDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        if (messageText) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.innerHTML = `
                <b>${username}</b>
                <p>${messageText}</p>
                <span class="timestamp">${formattedDate}, ${formattedTime}</span>
                <a href="#reply" class="reply-button" onclick="document.getElementById('message-input').value = '@${username} ';">Ответить</a>
            `;
            messageContainer.appendChild(message);
            messageInput.value = '';
            messageContainer.scrollTop = messageContainer.scrollHeight; // Прокрутка вниз
        }
    }
</script>

</body>
</html>

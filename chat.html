<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню сайта</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #121212, #ffffff);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .menu {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 320px;
            height: 65%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 24px;
            color: #ff69b4;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        #nicknameDisplay {
            color: #ffffff;
            margin-top: 2px;
            font-size: 14px;
        }

        .nickname-admin {
            font-size: 16px;
            animation: shine 1s infinite alternate;
        }

        @keyframes shine {
            0% {color: #ff69b4;}
            100% {color: #ff4500;}
        }

        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px;
            border-radius: 8px;
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .content::-webkit-scrollbar {
            width: 10px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(80, 80, 80, 0.8);
            border-radius: 8px;
        }

        .content::-webkit-scrollbar-thumb {
            background-color: rgba(255, 105, 180, 0.9);
            border-radius: 8px;
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 20, 147, 0.9);
        }

        .input-area {
            display: flex;
            align-items: center;
            border-radius: 10px;
            background-color: rgba(50, 50, 50, 0.8);
            position: relative;
            padding: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            margin-right: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #800080, #dda0dd);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #a05cb3, #ff00ff);
        }

        .message {
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            word-wrap: break-word;
            position: relative;
            font-family: 'Arial', sans-serif;
            max-width: calc(100% - 20px);
        }

        .message.guest {
            background: linear-gradient(135deg, #4e4e4e 30%, #3a3a3a 100%);
        }

        .message.admin {
            background: linear-gradient(135deg, #8B0000, #4B0000);
        }

        .admin-tag, .guest-tag {
            border-radius: 7.5px;
            padding: 2px 5px;
            font-size: 10px;
            margin-left: 5px;
        }

        .admin-tag {
            background-color: rgba(255, 105, 180, 0.8);
            color: #ffffff;
        }

        .guest-tag {
            background-color: rgba(128, 128, 128, 0.8);
            color: #ffffff;
        }

        .message b {
            color: #e0e0e0;
            font-size: 11px;
            font-weight: bold;
        }

        .message p {
            margin: 2px 0;
            font-size: 13px;
            color: #ccc;
        }

        .timestamp {
            font-size: 9px;
            color: #bbb;
            margin-top: 4px;
        }

        .message .reply-button {
            font-size: 9px;
            color: #007bff;
            text-decoration: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-weight: bold;
        }

        .avatar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .avatar-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
            width: 400px;
        }

        .avatar-modal img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 5px; 
        }

        .avatar-modal .user-tag {
            color: #ff69b4;
            font-size: 16px;
            margin: 0 0 10px 0;
            text-align: center; 
        }

        .avatar-modal img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto; 
            display: block; 
        }        

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="menu" id="menu">
    <img src="https://i.postimg.cc/VdXdtdvR/user.png" alt="Аватарка" class="avatar" id="avatar">
    <div class="header">
        <h1>GirlFlap</h1>
        <div id="nicknameDisplay">
            NickName: <span id="nicknameText"></span>
        </div>
    </div>
    <div class="content" id="message-container">
        <!-- Сообщения будут отображаться здесь -->
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-button">Отправить</button>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay"></div>
<div class="avatar-modal" id="avatar-modal">
    <img id="new-avatar-preview" src="https://i.postimg.cc/VdXdtdvR/user.png" alt="Новая Аватарка" style="margin-bottom: 5px;">
    <div class="user-tag" id="user-tag"></div>
    <input type="file" id="avatar-input" accept="image/*" style="display: none;">
    <button id="close-modal-button" style="margin-top: 20px;">Закрыть</button>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const messageContainer = document.getElementById('message-container');
    const nicknameDisplay = document.getElementById('nicknameText');
    const avatar = document.getElementById('avatar');
    const avatarModal = document.getElementById('avatar-modal');
    const modalOverlay = document.getElementById('modal-overlay');
    const avatarInput = document.getElementById('avatar-input');
    const newAvatarPreview = document.getElementById('new-avatar-preview');
    const closeModalButton = document.getElementById('close-modal-button');
    const userTagDisplay = document.getElementById('user-tag');

    const nickname = localStorage.getItem('nickname');
    const isAdmin = localStorage.getItem('isAdmin') === 'true';
    const adminKey = "GirlAdmin-R5QRbNZsQSSgLRjqNGfK9";
    userTagDisplay.innerHTML = `${nickname || 'GirlFlap'} <span class="${isAdmin ? 'admin-tag' : 'guest-tag'}">${isAdmin ? 'Администратор' : 'Гость'}</span>`;
    nicknameDisplay.innerText = nickname ? nickname : 'Без имени';

    if (nickname) {
        document.getElementById('nicknameDisplay').style.display = 'block';
    } else {
        document.getElementById('nicknameDisplay').style.display = 'none'; 
    }

    let userID = localStorage.getItem('userID');

    if (userID === null) {
        userID = Math.floor(Math.random() * 1001);
        localStorage.setItem('userID', userID);
    }

    loadMessages();

    sendButton.addEventListener('click', sendMessage);
    avatar.addEventListener('click', openAvatarModal);
    avatarInput.addEventListener('change', previewAvatar);
    closeModalButton.addEventListener('click', closeAvatarModal);
    modalOverlay.addEventListener('click', closeAvatarModal);

    function escapeHTML(html) {
        const div = document.createElement('div');
        div.innerText = html;
        return div.innerHTML;
    }

    function sendMessage() {
        const messageText = messageInput.value.trim();
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = currentDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        if (messageText.startsWith('/clear ')) {
            const inputKey = messageText.replace('/clear ', '').trim();
            if (nickname === 'DreamGirl' && inputKey === adminKey) {
                localStorage.removeItem('messages');
                loadMessages();
                messageInput.value = ''; 
                return;
            }
        }

        if (messageText.startsWith('/setadmin ')) {
            const inputKey = messageText.replace('/setadmin ', '').trim();
            if (nickname === 'DreamGirl' && inputKey === adminKey) {
                localStorage.setItem('isAdmin', true);
                userTagDisplay.innerHTML = `${nickname} <span class="admin-tag">Администратор</span>`;
            } else if (nickname === 'DreamGirl' && inputKey !== adminKey) {
                alert("Неверный ключ администратора.");
            }
            messageInput.value = '';
            return;
        }

        if (messageText) {
            const message = {
                username: `${nickname || 'GirlFlap'} [${userID}]`,
                text: escapeHTML(messageText),
                date: formattedDate,
                time: formattedTime,
                tag: isAdmin ? "Администратор" : "Гость"
            };

            saveMessage(message);
            messageInput.value = '';
            displayMessage(message);
        }
    }

    function saveMessage(message) {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messages.push(message);
        localStorage.setItem('messages', JSON.stringify(messages));
    }

    function loadMessages() {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messageContainer.innerHTML = '';
        messages.forEach(displayMessage);
    }

    function displayMessage(message) {
        const msgElement = document.createElement('div');
        msgElement.classList.add('message');
        msgElement.classList.add(message.tag === "Администратор" ? 'admin' : 'guest');

        const tagElement = message.tag === "Администратор" 
            ? '<span class="admin-tag">Администратор</span>' 
            : '<span class="guest-tag">Гость</span>';

        msgElement.innerHTML = `
            <b>${message.username}${tagElement}</b>
            <p>${message.text}</p>
            <span class="timestamp">${message.date}, ${message.time}</span>
            <a href="#reply" class="reply-button" onclick="document.getElementById('message-input').value = '@${message.username} ';"><strong>Ответить</strong></a>
        `;
        messageContainer.appendChild(msgElement);
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function openAvatarModal() {
        modalOverlay.style.display = 'block';
        avatarModal.style.display = 'block';
    }

    function closeAvatarModal() {
        modalOverlay.style.display = 'none';
        avatarModal.style.display = 'none';
    }

    function previewAvatar() {
        const file = avatarInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                newAvatarPreview.src = event.target.result;
                avatar.src = event.target.result;
                localStorage.setItem('avatar', event.target.result);
            }
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedAvatar = localStorage.getItem('avatar');
        if (savedAvatar) {
            avatar.src = savedAvatar;
            newAvatarPreview.src = savedAvatar;
        }
    }

    loadAvatar(); 

    setInterval(loadMessages, 10000);
</script>

</body>
</html>

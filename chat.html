<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню сайта</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #121212, #ffffff);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .menu {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            width: 95%; 
            max-width: 350px; 
            height: 60%;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: translateY(-100%);
            opacity: 0;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .menu.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 24px;
            color: #ff69b4;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        #nicknameDisplay {
            color: #ffffff;
            margin-top: 2px;
            font-size: 14px;
        }

        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px;
            border-radius: 8px;
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 8px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbar Styles */
        .content::-webkit-scrollbar {
            width: 8px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(50, 50, 50, 0.6);
            border-radius: 10px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 10px;
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: #ff00ff;
        }

        .input-area {
            display: flex;
            align-items: center;
            border-radius: 10px;
            background-color: rgba(50, 50, 50, 0.8);
            position: relative;
            padding: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            margin-right: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #800080, #dda0dd);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #a05cb3, #ff00ff);
        }

        .message {
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            word-wrap: break-word;
            position: relative;
            font-family: 'Arial', sans-serif;
            max-width: calc(100% - 20px);
        }

        .message.guest {
            background: linear-gradient(135deg, #4e4e4e 30%, #3a3a3a 100%);
        }

        .message.admin {
            background: linear-gradient(135deg, #8B0000, #4B0000);
        }

        .message.owner {
            background: linear-gradient(135deg, #ff69b4, #ff007f);
        }

        .admin-tag,
        .guest-tag,
        .owner-tag {
            border-radius: 7.5px;
            padding: 2px 5px;
            font-size: 10px;
            margin-left: 5px;
            opacity: 0.9;
        }

        .admin-tag {
            background-color: rgba(255, 0, 0, 0.6);
            color: #ffffff;
        }

        .owner-tag {
            background-color: rgba(255, 105, 180, 0.6);
            color: #ffffff;
        }

        .guest-tag {
            background-color: rgba(128, 128, 128, 0.8);
            color: #ffffff;
        }

        .message b {
            color: #e0e0e0;
            font-size: 11px;
            font-weight: bold;
        }

        .message p {
            margin: 2px 0;
            font-size: 13px;
            color: #ccc;
        }

        .timestamp {
            font-size: 9px;
            color: #bbb;
            margin-top: 4px;
            user-select: none;
        }

        .message .reply-button {
            font-size: 9px;
            color: #007bff;
            text-decoration: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-weight: bold;
            user-select: none;
        }

        .avatar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .avatar-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 10px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
            width: 80%; 
            max-width: 300px; 
        }

        .avatar-modal img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto; 
            display: block; 
            cursor: pointer; 
        }        

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="menu" id="menu">
    <img src="https://i.postimg.cc/VdXdtdvR/user.png" alt="Аватарка" class="avatar" id="avatar">
    <div class="header">
        <h1>GirlFlap</h1>
        <div id="nicknameDisplay">
            NickName: <span id="nicknameText"></span>
        </div>
    </div>
    <div class="content" id="message-container">
        <!-- Сообщения будут отображаться здесь -->
    </div>

    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-button">Отправить</button>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay"></div>
<div class="avatar-modal" id="avatar-modal">
    <img id="new-avatar-preview" src="https://i.postimg.cc/VdXdtdvR/user.png" alt="Новая Аватарка" style="margin-bottom: 5px;">
    <div class="user-tag" id="user-tag"></div>
    <input type="file" id="avatar-input" accept="image/*" style="display: none;">
    <button id="close-modal-button" style="margin-top: 20px;">Закрыть</button>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const messageContainer = document.getElementById('message-container');
    const nicknameDisplay = document.getElementById('nicknameText');
    const avatar = document.getElementById('avatar');
    const avatarModal = document.getElementById('avatar-modal');
    const modalOverlay = document.getElementById('modal-overlay');
    const avatarInput = document.getElementById('avatar-input');
    const newAvatarPreview = document.getElementById('new-avatar-preview');
    const closeModalButton = document.getElementById('close-modal-button');
    const userTagDisplay = document.getElementById('user-tag');
    const menu = document.getElementById('menu');

    const nickname = localStorage.getItem('nickname') || 'GirlFlap';
    const isAdmin = localStorage.getItem('isAdmin') === 'true';
    const adminTags = ['Гость', 'Мл. Модер', 'Ст. Модер', 'Мл. Админ', 'Администратор', 'Ст. Админ', 'Владелец'];

    userTagDisplay.innerHTML = `${nickname} <span class="${nickname === 'DreamGirl' ? 'owner-tag' : isAdmin ? 'admin-tag' : 'guest-tag'}">${nickname === 'DreamGirl' ? 'Владелец' : adminTags[isAdmin ? 2 : 0]}</span>`;
    nicknameDisplay.innerText = nickname;

    let userID = localStorage.getItem('userID') || Math.floor(Math.random() * 1001);
    localStorage.setItem('userID', userID);

    loadMessages();
    loadAvatar();
    menu.classList.add('visible'); // Плавное открытие меню

    avatar.addEventListener('click', () => {
        modalOverlay.style.display = 'block';
        avatarModal.style.display = 'block';
    });

    newAvatarPreview.addEventListener('click', () => {
        avatarInput.click();
    });

    avatarInput.addEventListener('change', previewAvatar);
    closeModalButton.addEventListener('click', closeAvatarModal);
    modalOverlay.addEventListener('click', closeAvatarModal);
    
    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    function escapeHTML(html) {
        const div = document.createElement('div');
        div.innerText = html;
        return div.innerHTML;
    }

    function sendMessage() {
        const messageText = messageInput.value.trim();
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = currentDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        if (messageText.startsWith('/setadmin ')) {
            const parts = messageText.split(' ');
            if (parts.length === 3 && nickname === 'DreamGirl') {
                const targetNickname = parts[1];
                const newAdminLevel = Number(parts[2]);
                if (newAdminLevel >= 1 && newAdminLevel <= 5) {
                    localStorage.setItem(`adminLevel_${targetNickname}`, newAdminLevel);
                    updateUserTag(targetNickname);
                }
            }
            messageInput.value = '';
            return;
        }

        if (messageText) {
            const message = {
                username: `${nickname} [${userID}]`,
                text: escapeHTML(messageText),
                date: formattedDate,
                time: formattedTime,
                tag: isAdmin ? "Администратор" : "Гость"
            };

            saveMessage(message);
            messageInput.value = '';
            displayMessage(message);
        }
    }

    function saveMessage(message) {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messages.push(message);
        localStorage.setItem('messages', JSON.stringify(messages));
    }

    function loadMessages() {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messageContainer.innerHTML = '';
        messages.forEach(displayMessage);
    }

    function displayMessage(message) {
        const msgElement = document.createElement('div');
        msgElement.classList.add('message', message.tag === "Администратор" ? 'admin' : 'guest');

        const tagElement = (nickname === 'DreamGirl') 
            ? '<span class="owner-tag">Владелец</span>' 
            : `<span class="${isAdmin ? 'admin-tag' : 'guest-tag'}">${adminTags[isAdmin ? 2 : 0]}</span>`;

        msgElement.innerHTML = `
            <b>${message.username}${tagElement}</b>
            <p>${message.text}</p>
            <span class="timestamp">${message.date}, ${message.time}</span>
            <a href="#reply" class="reply-button" onclick="document.getElementById('message-input').value = '@${message.username} '; return false;"><strong style="font-weight:bold;">Ответить</strong></a>
        `;
        messageContainer.appendChild(msgElement);
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function closeAvatarModal() {
        modalOverlay.style.display = 'none';
        avatarModal.style.display = 'none';
    }

    function previewAvatar() {
        const file = avatarInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                newAvatarPreview.src = event.target.result;
                avatar.src = event.target.result; 
                localStorage.setItem('avatar', event.target.result);
            }
            reader.readAsDataURL(file);
        }
    }

    function loadAvatar() {
        const savedAvatar = localStorage.getItem('avatar') || 'https://i.postimg.cc/VdXdtdvR/user.png';
        avatar.src = savedAvatar;
        newAvatarPreview.src = savedAvatar;
    }

    function updateUserTag(targetNickname) {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messages.forEach((message) => {
            if (message.username.includes(targetNickname)) {
                const level = localStorage.getItem(`adminLevel_${targetNickname}`) || 0;
                message.tag = adminTags[level] ? adminTags[level] : "Гость";
            }
        });
        loadMessages();
    }

    setInterval(loadMessages, 10000);
</script>

</body>
</html>

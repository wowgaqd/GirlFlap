<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню сайта</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom right, #121212, #ffffff);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Отключение прокрутки страницы */
        }

        .menu {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 320px;
            height: 65%; /* Установлена высота 65% от высоты окна */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px;
            border-radius: 8px;
            background-color: rgba(50, 50, 50, 0.8);
            margin-bottom: 8px;
            padding-bottom: 50px; /* Отступ снизу для учета области ввода */
            scrollbar-width: thin; 
            scrollbar-color: #555 #444; 
        }

        .content::-webkit-scrollbar {
            width: 8px; 
        }

        .content::-webkit-scrollbar-track {
            background: #444; 
            border-radius: 8px; 
        }

        .content::-webkit-scrollbar-thumb {
            background-color: #555; 
            border-radius: 8px; 
        }

        .content::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }

        .input-area {
            display: flex;
            align-items: center;
            border: 1px solid rgba(128, 128, 128, 0.5);
            padding: 8px; 
            border-radius: 10px;
            background-color: rgba(50, 50, 50, 0.8);
            position: absolute; 
            bottom: 10px; 
            left: 10px;
            right: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px; 
            border: none;
            border-radius: 8px; 
            margin-right: 8px; 
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 8px 12px; 
            border: none;
            border-radius: 8px; 
            background: linear-gradient(45deg, #800080, #dda0dd);
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #a05cb3, #ff00ff);
        }

        @media (max-width: 600px) {
            .menu {
                width: 95%;
                max-width: 90%; 
            }
        }

        .message {
            background: linear-gradient(135deg, #4e4e4e 30%, #3a3a3a 100%);
            border-radius: 8px; 
            padding: 6px 10px; 
            margin-bottom: 10px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); 
            word-wrap: break-word;
            font-family: 'Arial', sans-serif;
            max-width: calc(100% - 20px); 
            position: relative;
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }

        .message b {
            color: #e0e0e0;
            font-size: 11px; 
            font-weight: bold;
        }

        .message p {
            margin: 2px 0; 
            font-size: 13px; 
            color: #ccc;
        }

        .timestamp {
            font-size: 9px; 
            color: #bbb;
            margin-top: 4px;
        }

        .message .reply-button {
            font-size: 9px; 
            color: #007bff;
            text-decoration: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
        }

        .guest-tag {
            background-color: rgba(128, 128, 128, 0.5);
            color: #ffffff;
            border-radius: 7.5px;
            padding: 2px 5px;
            font-size: 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="menu" id="menu">
    <div class="content" id="message-container"></div>
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-button">Отправить</button>
    </div>
</div>

<script>
    const sendButton = document.getElementById('send-button');
    const messageInput = document.getElementById('message-input');
    const messageContainer = document.getElementById('message-container');

    // Состояние для уникальных ID
    let userID = localStorage.getItem('userID');
    if (userID === null) {
        userID = Math.floor(Math.random() * 1001); // Генерация уникального ID от 0 до 1000
        localStorage.setItem('userID', userID);
    }

    // Загрузка существующих сообщений
    loadMessages();

    sendButton.addEventListener('click', sendMessage);

    // Скрытие клавиатуры при нажатии на пустое пространство
    document.body.addEventListener('click', function(event) {
        if (event.target !== messageInput && !messageInput.contains(event.target)) {
            messageInput.blur(); // Скрывает клавиатуру
        }
    });

    function sendMessage() {
        const messageText = messageInput.value.trim();
        const username = `GirlFlap[${userID}]`; // Имя пользователя с ID
        const currentDate = new Date();
        const formattedDate = currentDate.toLocaleDateString('ru-RU', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = currentDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        if (messageText) {
            const message = {
                username: username,
                text: messageText,
                date: formattedDate,
                time: formattedTime
            };

            // Сохранение нового сообщения
            saveMessage(message);
            messageInput.value = '';

            // Обновление содержимого контейнера
            displayMessage(message);
        }
    }

    function saveMessage(message) {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messages.push(message);
        localStorage.setItem('messages', JSON.stringify(messages));
    }

    function loadMessages() {
        const messages = JSON.parse(localStorage.getItem('messages')) || [];
        messageContainer.innerHTML = ''; // Очистка контейнера перед загрузкой
        messages.forEach(displayMessage);
    }

    function displayMessage(message) {
        const msgElement = document.createElement('div');
        msgElement.classList.add('message');
        msgElement.innerHTML = `
            <b>${message.username}<span class="guest-tag">Гость</span></b>
            <p>${message.text}</p>
            <span class="timestamp">${message.date}, ${message.time}</span>
            <a href="#reply" class="reply-button" onclick="document.getElementById('message-input').value = '@${message.username} ';">Ответить</a>
        `;
        messageContainer.appendChild(msgElement);
        messageContainer.scrollTop = messageContainer.scrollHeight; // Прокрутка вниз
    }

    // Обновление сообщений каждые 10 секунд
    setInterval(loadMessages, 10000);
</script>

</body>
</html>

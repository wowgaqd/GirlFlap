<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GirlChat</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #282828, #121212);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-size: 95%;
            overflow: hidden;
            position: relative;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #121212;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.2);
        }

        .chat-container {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 7.6px;
            box-shadow: 0 1.9px 9.5px rgba(0, 0, 0, 0.5);
            padding: 19px;
            width: 90%;
            max-width: 600px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            margin: 19px auto;
        }

        .message {
            background-color: #444;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 0 1.9px 4.8px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
        }

        #login-btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .close-btn {
            color: white;
            cursor: pointer;
            float: right;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 600px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 25px;
            margin-bottom: 10px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border: 1px solid #007bff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GirlChat</h1>
        <button id="login-btn">Login</button>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-container" id="input-container">
        <form id="chat-form" onsubmit="sendMessage(event)">
            <input type="text" name="message" placeholder="Введите сообщение..." required id="message-input">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <div class="modal" id="login-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Вход</h2>
            <input type="text" id="username" placeholder="Username" required><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <script>
        let username = 'гость';

        function sendMessage(event) {
            event.preventDefault();
            const messageInput = document.getElementById('message-input');
            const messageText = messageInput.value.trim();

            if (messageText) {
                displayMessage({ username, text: messageText, time: new Date().toLocaleString() });
                messageInput.value = '';
            }
        }

        function displayMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.innerHTML = `
                <b class="user">${message.username}</b>
                <p>${message.text}</p>
                <span>${message.time}</span>
            `;
            document.getElementById('chat-container').appendChild(messageElement);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === '@GirlFlap' && pass === 'ADMIN-5R3BniaWDoYpRKc5JyPjGirlFlap') {
                username = user;
                document.getElementById('login-modal').style.display = 'none';
            } else {
                alert('Неверный логин или пароль!');
            }
        }

        document.getElementById('login-btn').onclick = function() {
            document.getElementById('login-modal').style.display = 'flex';
        };

        document.getElementById('close-modal').onclick = function() {
            document.getElementById('login-modal').style.display = 'none';
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>GirlChat</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #282828, #121212);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-size: 95%;
            overflow: hidden;
            position: relative;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
            background-color: #121212;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.2);
        }

        .chat-container {
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 7.6px;
            box-shadow: 0 1.9px 9.5px rgba(0, 0, 0, 0.5);
            padding: 19px;
            width: 70%;
            height: 400px;
            overflow-y: auto;
            margin: 19px auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Стили и другие классы остаются прежними */

        .input-container {
            position: absolute;
            bottom: 15px;
            transition: transform 0.3s ease-in-out;
        }

        /* Подъем поля ввода и чат */
        .input-container.active {
            transform: translateY(-250px);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>GirlChat</h1>
    </div>

    <div class="chat-container" id="chat-container"></div>

    <div class="input-container" id="input-container">
        <div class="error-message" id="error-message">Сообщение можно отправлять раз в 10 секунд</div>
        <form id="chat-form" onsubmit="sendMessage(event)">
            <input type="text" name="message" placeholder="Введите сообщение..." required id="message-input" onfocus="bringUpInput()">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script>
        window.addEventListener('touchmove', function (e) {
            e.preventDefault();
        }, { passive: false });

        let userId = localStorage.getItem('userId') || Math.floor(Math.random() * 1000);
        localStorage.setItem('userId', userId);
        const sendCooldown = 10000;
        let lastSendTime = 0;
        let messages = [];

        // Установка веб-сокетов
        const socket = new WebSocket('ws://your-websocket-url'); // Укажите ваш адрес веб-сокета

        socket.onmessage = function (event) {
            // Обработка новых сообщений
            const newMessage = JSON.parse(event.data);
            messages.push(newMessage);
            displayMessages();
        };

        function sendMessage(event) {
            event.preventDefault();
            const messageInput = document.getElementById('message-input');
            const messageText = messageInput.value.trim();
            const currentTime = new Date().getTime();
            const errorMessage = document.getElementById('error-message');

            if (messageText) {
                if (currentTime - lastSendTime >= sendCooldown) {
                    const newMessage = {
                        user_id: userId,
                        text: messageText,
                        time: new Date().toLocaleString()
                    };

                    socket.send(JSON.stringify(newMessage)); // Отправляем новое сообщение через веб-сокет
                    messageInput.value = '';
                    lastSendTime = currentTime;
                    errorMessage.style.visibility = 'hidden';
                    messageInput.style.border = '';
                } else {
                    errorMessage.style.visibility = 'visible';
                    messageInput.style.border = '1px solid red';
                }
            }
        }

        function displayMessages() {
            const messagesContainer = document.getElementById('chat-container');
            messagesContainer.innerHTML = '';

            messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');
                messageElement.innerHTML = `
                    <b class="user">GirlFlal${message.user_id}<span class="player-tag">игрок</span></b>
                    <p>${message.text}</p>
                    <span>${message.time}</span>
                `;
                messagesContainer.appendChild(messageElement);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight; // Автоматическая прокрутка вниз
        }

        function bringUpInput() {
            const inputContainer = document.getElementById('input-container');
            inputContainer.classList.add('active');
        }

        window.addEventListener('click', function (e) {
            const inputContainer = document.getElementById('input-container');
            const messageInput = document.getElementById('message-input');

            if (!inputContainer.contains(e.target) && messageInput !== e.target) {
                messageInput.blur();
                inputContainer.classList.remove('active');
            }
        });

        window.onload = () => {
            fetchMessages();
        };
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация промокода</title>
    <style>
        /* Стили остаются без изменений */
    </style>
</head>
<body>
    <div class="container">
        <h1>Активация промокода</h1>
        <form id="promoForm" onsubmit="return activatePromoCode(event)">
            <input type="text" id="promoCode" placeholder="Введите промокод" required />
            <button type="submit">Активировать</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        async function activatePromoCode(event) {
            event.preventDefault(); // предотвращаем отправку формы

            const promoCode = document.getElementById('promoCode').value;
            const resultDiv = document.getElementById('result');
            
            // Получаем ID пользователя из параметров URL (например, передаем из бота)
            const userId = /* Получите ID пользователя из URL или другой логики */;
            
            // Отправляем команду боту
            const botToken = "8063347696:AAHzOBTt8E4Msnys8vLvSETKrw7z6PDwvw4"; // Укажите токен вашего бота

            const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: userId,
                    text: `/activate_promo ${promoCode}` // Отправляем команду боту с промокодом
                })
            });

            const responseData = await response.json();
            if (responseData.ok) {
                resultDiv.innerHTML = 'Запрос на активацию промокода отправлен!';
            } else {
                resultDiv.innerHTML = 'Ошибка при отправке запроса.';
            }

            // Очищаем поле ввода
            document.getElementById('promoCode').value = '';
        }
    </script>
</body>
</html>
